<svg width="1200" height="900" viewBox="0 0 1200 900"
     xmlns="http://www.w3.org/2000/svg">
 <defs>

    <!-- SOMBRAS -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="5"
        dy="8"
        stdDeviation="7"
        flood-opacity="0.35"/>
    </filter>

    <!-- TEXTURA LEVE -->
    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.7"
        numOctaves="3"
        stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- FUNDO -->
  <!-- ================================================= -->

  <rect width="1200" height="900" fill="#252027"/>

  <rect width="1200"
        height="900"
        filter="url(#grain)"
        opacity="0.7"/>


  <!-- ================================================= -->
  <!-- MANCHAS ORGÂNICAS DE COR -->
  <!-- ================================================= -->

  <path
    d="M-80 180
       C100 40 270 100 330 250
       C380 360 170 410 -60 330 Z"
    fill="#a84266"
    opacity="0.75"/>

  <path
    d="M890 -40
       C1090 30 1250 120 1190 310
       C1140 390 1000 350 930 230 Z"
    fill="#315d70"
    opacity="0.8"/>

  <path
    d="M680 630
       C850 500 1080 540 1250 690
       L1250 950
       L700 950
       C630 850 600 710 680 630 Z"
    fill="#9a7138"
    opacity="0.65"/>

  <path
    d="M-50 690
       C100 560 260 610 350 720
       C410 820 260 920 -50 920 Z"
    fill="#526650"
    opacity="0.7"/>


  <!-- ================================================= -->
  <!-- RECORTE DE JORNAL 01 -->
  <!-- ================================================= -->

  <g transform="translate(420 70) rotate(-5)"
     filter="url(#shadow)">

    <rect
      width="330"
      height="105"
      fill="#ded5bf"/>

    <text
      x="18"
      y="38"
      font-family="Georgia, serif"
      font-size="26"
      font-weight="bold"
      fill="#272426">

      CULTURA

    </text>

    <text
      x="18"
      y="65"
      font-family="Georgia, serif"
      font-size="13"
      fill="#454044">

      música · arte · memória · criação

    </text>

    <text
      x="18"
      y="87"
      font-family="Georgia, serif"
      font-size="11"
      fill="#555054">

      pequenas coisas também contam histórias.

    </text>

  </g>


  <!-- ================================================= -->
  <!-- RECORTE DE JORNAL 02 -->
  <!-- ================================================= -->

  <g transform="translate(60 390) rotate(5)"
     filter="url(#shadow)">

    <rect
      width="190"
      height="78"
      fill="#e6ddc6"/>

    <text
      x="15"
      y="34"
      font-family="Georgia, serif"
      font-size="22"
      font-weight="bold"
      fill="#302b2c">

      CRIAR

    </text>

    <text
      x="15"
      y="58"
      font-family="Georgia, serif"
      font-size="12"
      fill="#555">

      experimentar · errar · tentar

    </text>

  </g>


  <!-- ================================================= -->
  <!-- RECORTE DE JORNAL 03 -->
  <!-- ================================================= -->

  <g transform="translate(920 555) rotate(-8)"
     filter="url(#shadow)">

    <rect
      width="210"
      height="80"
      fill="#d9cbb0"/>

    <text
      x="16"
      y="32"
      font-family="Georgia, serif"
      font-size="20"
      font-weight="bold"
      fill="#312c2c">

      MEMÓRIA

    </text>

    <text
      x="16"
      y="57"
      font-family="Georgia, serif"
      font-size="11"
      fill="#555">

      guardar aquilo que importa

    </text>

  </g>


  <!-- ================================================= -->
  <!-- DISCO DE VINIL -->
  <!-- ================================================= -->

  <g transform="translate(800 80)"
     filter="url(#shadow)">

    <circle
      cx="130"
      cy="130"
      r="125"
      fill="#111014"/>

    <circle
      cx="130"
      cy="130"
      r="96"
      fill="none"
      stroke="#29262d"
      stroke-width="3"/>

    <circle
      cx="130"
      cy="130"
      r="67"
      fill="none"
      stroke="#29262d"
      stroke-width="3"/>

    <circle
      cx="130"
      cy="130"
      r="38"
      fill="#b45c45"/>

    <circle
      cx="130"
      cy="130"
      r="7"
      fill="#171519"/>

  </g>


  <!-- ================================================= -->
  <!-- CÂMERA VINTAGE -->
  <!-- ================================================= -->

  <g transform="translate(50 120) rotate(-10)"
     filter="url(#shadow)">

    <rect
      x="0"
      y="45"
      width="245"
      height="145"
      rx="15"
      fill="#3b3839"/>

    <rect
      x="45"
      y="15"
      width="85"
      height="45"
      rx="8"
      fill="#4c4948"/>

    <circle
      cx="125"
      cy="118"
      r="58"
      fill="#171519"/>

    <circle
      cx="125"
      cy="118"
      r="40"
      fill="#30343a"/>

    <circle
      cx="125"
      cy="118"
      r="25"
      fill="#151519"/>

    <circle
      cx="205"
      cy="70"
      r="9"
      fill="#a65d47"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — MÚSICA -->
  <!-- ================================================= -->

  <g transform="translate(295 205) rotate(7)"
     filter="url(#shadow)">

    <image
      href="musica.jpg"
      width="255"
      height="205"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — LIVROS -->
  <!-- ================================================= -->

  <g transform="translate(885 330) rotate(-8)"
     filter="url(#shadow)">

    <image
      href="livros.jpg"
      width="230"
      height="205"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — ESCRITA -->
  <!-- ================================================= -->

  <g transform="translate(475 335) rotate(-4)"
     filter="url(#shadow)">

    <image
      href="escrita.jpg"
      width="270"
      height="220"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — DANÇA -->
  <!-- ================================================= -->

  <g transform="translate(100 520) rotate(-6)"
     filter="url(#shadow)">

    <image
      href="danca.jpg"
      width="270"
      height="225"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — ARTE -->
  <!-- ================================================= -->

  <g transform="translate(750 590) rotate(5)"
     filter="url(#shadow)">

    <image
      href="arte.jpg"
      width="280"
      height="215"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- FOTO — PEQUENAS COISAS -->
  <!-- ================================================= -->

  <g transform="translate(400 650) rotate(8)"
     filter="url(#shadow)">

    <image
      href="pequenascoisas.jpg"
      width="230"
      height="185"
      preserveAspectRatio="xMidYMid slice"/>

  </g>


  <!-- ================================================= -->
  <!-- TIRA DE FILME -->
  <!-- ================================================= -->

  <g transform="translate(615 610) rotate(-12)">

    <rect
      width="430"
      height="72"
      fill="#171519"
      opacity="0.95"/>

    <g fill="#d8cfbb">

      <rect x="15"  y="10" width="48" height="52"/>
      <rect x="75"  y="10" width="48" height="52"/>
      <rect x="135" y="10" width="48" height="52"/>
      <rect x="195" y="10" width="48" height="52"/>
      <rect x="255" y="10" width="48" height="52"/>
      <rect x="315" y="10" width="48" height="52"/>
      <rect x="375" y="10" width="40" height="52"/>

    </g>

  </g>


  <!-- ================================================= -->
  <!-- TÍTULO -->
  <!-- ================================================= -->

  <g transform="translate(355 455) rotate(2)">

    <rect
      width="335"
      height="108"
      fill="#252027"
      opacity="0.94"/>

    <text
      x="168"
      y="47"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="36"
      font-weight="bold"
      letter-spacing="4"
      fill="#eee3c9">

      ALÉM

    </text>

    <text
      x="168"
      y="84"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="25"
      font-style="italic"
      fill="#d58b63">

      do código

    </text>

  </g>


  <!-- ================================================= -->
  <!-- ANOTAÇÕES MANUSCRITAS -->
  <!-- ================================================= -->

  <text
    x="295"
    y="470"
    font-family="cursive"
    font-size="21"
    fill="#e8d9b8"
    transform="rotate(-8 295 470)">

    colecionando ideias.

  </text>


  <text
    x="730"
    y="285"
    font-family="cursive"
    font-size="19"
    fill="#e8d9b8"
    transform="rotate(9 730 285)">

    ouvir · observar · criar

  </text>


  <text
    x="645"
    y="820"
    font-family="cursive"
    font-size="19"
    fill="#e8d9b8"
    transform="rotate(-4 645 820)">

    algumas coisas não precisam ser explicadas.

  </text>


  <!-- ================================================= -->
  <!-- PEQUENOS ELEMENTOS -->
  <!-- ================================================= -->

  <text
    x="1035"
    y="570"
    font-size="35"
    fill="#d58b63"
    transform="rotate(15 1035 570)">

    ✦

  </text>


  <text
    x="360"
    y="120"
    font-size="28"
    fill="#d58b63"
    transform="rotate(-12 360 120)">

    ✂

  </text>


  <text
    x="720"
    y="160"
    font-size="25"
    fill="#d58b63"
    transform="rotate(10 720 160)">

    ♫

  </text>


  <!-- ================================================= -->
  <!-- FRASE FINAL -->
  <!-- ================================================= -->

  <text
    x="600"
    y="875"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="22"
    font-style="italic"
    fill="#eee3c9">

    Há mais em mim do que as coisas que programo.

  </text>

</svg>
